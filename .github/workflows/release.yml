# Publish a GitHub release for every version tag.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# Builds on Arch, the only system the dock targets, with the same script that
# rehearses a release locally (packaging/release.sh), then attaches the
# package, the binaries tarball and SHA256SUMS to a release for the tag.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk4 gtk4-layer-shell github-cli

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # makepkg refuses to run as root, which is what the container runs as.
      - name: Build
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder packaging/release.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Omarchy Dock ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
          {
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Copy the tarball's checksum into packaging/aur-bin/PKGBUILD."
          } >> "$GITHUB_STEP_SUMMARY"
