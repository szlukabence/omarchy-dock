# Lint and test every push to master and every pull request.
#
# On Arch, the only system the dock targets, with the same packages the
# release build uses. Formatting is not checked: the code keeps its own
# hand-kept layout rather than rustfmt's.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned by digest: a tag can be moved to a different image. Bump both
    # together when updating it.
    container: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    steps:
      # Packages come from one day's snapshot of the Arch Linux Archive, so a
      # rebuild of the same commit gets the same packages: like the image
      # digest, bump the date deliberately. The keyring first, so the
      # snapshot's signatures verify against keys of the same day; the image
      # ships pacman's keyring uninitialised, and without that the new keys
      # are never imported.
      - name: Pin the package repositories
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/26/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman-key --init
          pacman -Syy --noconfirm archlinux-keyring

      - name: Install build dependencies
        run: pacman -Suu --noconfirm --needed git rustup gtk4 gtk4-layer-shell

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # As an ordinary user, as the dock runs and as the release job builds:
      # the container is root, and root passes checks a user would fail.
      # The toolchain is the exact Rust release rust-toolchain.toml pins.
      - name: Install the pinned toolchain
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          rustver="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          runuser -u builder -- env HOME=/home/builder rustup toolchain install "$rustver" --profile minimal --component clippy

      - name: Clippy
        run: runuser -u builder -- env HOME=/home/builder cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: runuser -u builder -- env HOME=/home/builder cargo test --locked
