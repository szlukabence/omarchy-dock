# Lint and test every push to master and every pull request.
#
# On Arch, the only system the dock targets, with the same packages the
# release build uses. Formatting is not checked: the code keeps its own
# hand-kept layout rather than rustfmt's.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned by digest: a tag can be moved to a different image. Bump both
    # together when updating it.
    container: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rustup gtk4 gtk4-layer-shell

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The exact Rust release rust-toolchain.toml pins, never whatever is current.
      - name: Install the pinned toolchain
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" --profile minimal --component clippy

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked
